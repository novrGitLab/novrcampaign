# NovrCampaign — production stack for a single Ubuntu VPS (Contabo).
#
# Topology:
#   Internet :80/:443 -> caddy -> { / -> frontend, /api/* -> backend }
#   backend            -> db (postgres)  and  -> collector (external, shared net)
#   All app containers share the `novr-shared` network. Only `caddy` publishes
#   host ports. `db` is NEVER published to the host.
#
# Deploy: `./deploy.sh` on the VPS (git pull -> build -> up -> migrate -> health).
#
# The collector is a SEPARATE repository (novr-collection) that runs as its OWN
# compose stack (`cd ~/novr/novr-collection && docker compose up -d`). It is NOT
# part of this compose file. This stack runs on its own private network `novr`;
# only the `backend` additionally joins the shared NAMED network `novr-shared`,
# which the collector also joins. Whichever stack starts first creates
# `novr-shared` (no manual `docker network create` needed); the app itself boots
# fine without the collector present.
#
# The backend therefore resolves the collector as `http://collector:4100`
# (NP_COLLECTION_BASE_URL). Without the collector stack running, the backend
# keeps using its in-app collector (NP_COLLECTION_ENABLED=false). See
# docs/deployment/contabo.md.

services:
  # ── PostgreSQL (same VPS) ────────────────────────────────────────────────────
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - novr
    # Not published — reachable only by other services on the shared network.

  # ── Backend API (Node, Prisma) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: novrcampaign-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Force the API onto the internal network and disable the backend's
      # built-in static SPA serving (Caddy serves the SPA).
      NODE_ENV: production
      PORT: "4000"
      SERVE_STATIC: "false"
      # Collector wiring (only honoured when NP_COLLECTION_ENABLED=true in .env
      # AND the standalone collector stack is running on `novr-shared`).
      NP_COLLECTION_BASE_URL: ${NP_COLLECTION_BASE_URL:-http://collector:4100}
    expose:
      - "4000"
    networks:
      # The app runs on its OWN private network; it only additionally joins the
      # shared network so it can reach the standalone collector. If the collector
      # is not deployed, `novr-shared` need not exist for the app to work — see
      # NP_COLLECTION_ENABLED in .env.
      - novr
      - novr-shared

  # ── Frontend (Vite static, served by nginx) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Inlined by Vite at build time. Same-origin so Caddy proxies /api.
        VITE_API_URL: /api
    image: novrcampaign-frontend:local
    restart: unless-stopped
    networks:
      - novr

  # ── Reverse proxy + automatic TLS (Caddy) ────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Bare IP: set DOMAIN to the VPS IP and CADDY_SITE_ADDRESS=":80".
      # Real domain: set DOMAIN to the FQDN and CADDY_SITE_ADDRESS="${DOMAIN}"
      # for automatic HTTPS (see Caddyfile + runbook).
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - novr

networks:
  # Private network owned by this stack — the app works on it alone. (Not
  # `internal` — caddy needs outbound for ACME TLS and the backend fetches
  # sources / calls the LLM over the internet.)
  novr:
  # Shared with the standalone collector stack (novr-collection). Declared
  # `external: true` so the app ATTACHES to the network the collector creates,
  # without Compose warning about a name clash. deploy.sh runs
  # `docker network create novr-shared || true` first, so the app never fails
  # for lack of it (and only the backend joins it).
  novr-shared:
    external: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
