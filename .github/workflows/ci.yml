name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build publication
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse
          POSTGRES_PASSWORD: test_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    outputs:
      deploy_app: ${{ steps.changes.outputs.deploy_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify application changes
        id: changes
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          if [[ -n "$PREVIOUS" ]] && git cat-file -e "$PREVIOUS^{commit}" 2>/dev/null && git diff --quiet "$PREVIOUS" HEAD -- backend frontend packages package.json package-lock.json Caddyfile deploy.sh docker-compose.yml .dockerignore; then
            echo 'deploy_app=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy_app=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (npm ci, workspaces)
        run: npm ci

      - name: Generate database client
        run: npm -w backend run build

      - name: Lint @novr/ingest
        run: npm -w @novr/ingest run lint

      - name: Lint backend
        run: npm -w backend run lint

      - name: Test @novr/ingest (deterministic gate, 118 tests)
        run: npm -w @novr/ingest test

      - name: Migrate the test database and run the backend suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test_database_only@127.0.0.1:5432/pulse
          DIRECT_URL: postgresql://postgres:test_database_only@127.0.0.1:5432/pulse
          NP_LLM_API_KEY: test-double-only
          NP_LLM_BASE_URL: http://127.0.0.1:9/v1
          NP_LLM_ALLOW_LOCAL_BASE_URL: "true"
          PLUNK_API_KEY: test-double-only
          PLUNK_BASE_URL: http://127.0.0.1:9
        run: |
          npm run db:migrate
          npm -w backend test

      - name: Lint the Next.js application
        run: npm -w frontend run lint

      - name: Build newsroom and staff portal
        run: npm -w frontend run build

      - name: Start the packaged API and verify its routes
        env:
          DATABASE_URL: postgresql://postgres:test_database_only@127.0.0.1:5432/pulse
          DIRECT_URL: postgresql://postgres:test_database_only@127.0.0.1:5432/pulse
        run: |
          docker build --file backend/Dockerfile --tag pulse-api-ci .
          export JWT_SECRET="$(openssl rand -hex 32)"
          docker run --detach --network host --name pulse-api-ci -e DATABASE_URL -e DIRECT_URL -e JWT_SECRET pulse-api-ci
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://localhost:4000/api/health >/dev/null &&
               [[ "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:4000/api/auth/me)" == 401 ]]; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' pulse-api-ci)" != true ]]; then break; fi
            sleep 2
          done
          docker logs pulse-api-ci
          exit 1

  deploy:
    name: Deploy public newsroom and staff API
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.outputs.deploy_app == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-newsroom
      cancel-in-progress: false
    steps:
      - name: Prepare the VPS deployment key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, binascii, os, pathlib
          key = os.environ["DEPLOY_KEY"].strip().replace("\\n", "\n").replace("\r", "")
          if not key.startswith("-----BEGIN"):
              try:
                  decoded = base64.b64decode(key, validate=True).decode("ascii").strip()
                  if decoded.startswith("-----BEGIN"):
                      key = decoded
              except (ValueError, UnicodeError, binascii.Error):
                  pass
          if not key.startswith("-----BEGIN") or "PRIVATE KEY-----" not in key:
              raise SystemExit("VPS_SSH_KEY must contain the private deployment key for VPS_USER, including its header and footer.")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pulse-deploy-key"
          target.write_text(key + "\n")
          PY
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/pulse-deploy-key" >/dev/null 2>&1 || { echo 'VPS_SSH_KEY must be a valid, unattended OpenSSH/PEM deployment key.' >&2; exit 1; }
      - name: Release the tested revision
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ runner.temp }}/pulse-deploy-key
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: RELEASE_SHA
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/novr/novrcampaign"
            git diff --quiet && git diff --cached --quiet || { echo 'Tracked server changes need review'; exit 1; }
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA" || { echo 'A newer release superseded this job'; exit 0; }
            git merge --ff-only "$RELEASE_SHA"
            bash ./deploy.sh
      - name: Remove the temporary deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/pulse-deploy-key"
