# nginx config for the NovrCampaign dashboard SPA.
# Serves the Vite static build with client-side-routing history fallback.
# API traffic is proxied to the backend by Caddy, NOT here (this container only
# serves static assets on port 80, reachable only on the internal network).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; Vite emits content-hashed filenames.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: any non-file path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so a deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
